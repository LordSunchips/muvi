name: Muvi
options:
  bundleIdPrefix: com.muvi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Muvi:
    type: application
    platform: iOS
    sources:
      - path: Muvi
    info:
      path: Muvi/Info.plist
      properties:
        CFBundleDisplayName: muvi
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The app only talks HTTPS, which is exempt from export-compliance filing. Declaring it
        # here answers the question once instead of on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunchips.muvi
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Pinned here because the .xcodeproj is generated and gitignored: without this, every
        # `xcodegen generate` discards the team picked in Xcode and signing has to be set up by
        # hand again — easy to hit right before an archive.
        DEVELOPMENT_TEAM: 8589WU98SC
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Muvi:
    build:
      targets:
        Muvi: all
    run:
      config: Debug
    archive:
      config: Release
